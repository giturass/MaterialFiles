name: APKEditor validation
on:
  push:
    branches: [codex/apkeditor]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify APKEditor source and dependencies
        run: python3 third_party/apkeditor/verify_vendor.py
      - name: Test binary edits, split merges, XML and Smali round trips and signatures
        run: python3 tools/verify_apk_signing.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: apkeditor-engine-fixtures-${{ github.sha }}
          path: ~/tmp/materialfiles-apk-tools/test-runs/
          if-no-files-found: ignore
          retention-days: 7
