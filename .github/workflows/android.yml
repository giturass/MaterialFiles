name: Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  # Public certificate fingerprint of MDTerm's GitHub Actions release signing key.
  RELEASE_CERTIFICATE_SHA256: 4bea1b63b90233d46ed951d66bae2927440c595323234556da7d2038aec25e89

jobs:
  release:
    name: Build and verify signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0 ndk;30.0.16248370 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MDTERM_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/materialfiles-release.p12"

      - name: Build and lint release APK
        env:
          STORE_FILE: ${{ runner.temp }}/materialfiles-release.p12
          STORE_PASSWORD: ${{ secrets.MDTERM_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MDTERM_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MDTERM_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          ./gradlew --no-daemon --console=plain :app:assembleRelease :app:lintRelease

      - name: Verify signature and packaged editor
        run: |
          artifact_dir="$RUNNER_TEMP/materialfiles-release"
          mkdir -p "$artifact_dir"
          apk_name="MaterialFiles-${GITHUB_SHA:0:7}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$artifact_dir/$apk_name"
          python3 tools/verify_release_apk.py \
            --apk "$artifact_dir/$apk_name" \
            --build-tools "$ANDROID_HOME/build-tools/37.0.0" \
            --expected-certificate-sha256 "$RELEASE_CERTIFICATE_SHA256"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v6
        with:
          name: materialfiles-release-${{ github.sha }}
          path: ${{ runner.temp }}/materialfiles-release/*
          if-no-files-found: error
          retention-days: 90

      - name: Upload lint and R8 reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: materialfiles-build-reports-${{ github.sha }}
          path: |
            app/build/reports/lint-results-release.*
            app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/materialfiles-release.p12"
