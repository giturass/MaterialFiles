name: Debug APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0 ndk;30.0.16248370 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and lint debug APK
        run: ./gradlew --no-daemon --max-workers=2 --console=plain :app:assembleDebug :app:lintDebug

      - name: Verify and collect debug APK
        run: |
          artifact_dir="$RUNNER_TEMP/materialfiles-debug"
          mkdir -p "$artifact_dir"
          apk="$artifact_dir/MaterialFiles-${GITHUB_SHA:0:7}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk" > "${apk%.apk}.signature.txt"
          python3 tools/verify_no_tracking.py \
            --apk "$apk" \
            --aapt2 "$ANDROID_HOME/build-tools/37.0.0/aapt2" > "${apk%.apk}.verification.json"
          python3 - "$apk" <<'PY'
          import sys
          import zipfile
          sys.path.insert(0, 'tools')
          from verify_no_tracking import dex_class_names
          with zipfile.ZipFile(sys.argv[1]) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('Invalid ZIP entry: ' + bad)
              names = set(archive.namelist())
              classes = set()
              for name in sorted(names):
                  if name.startswith('classes') and name.endswith('.dex'):
                      classes.update(dex_class_names(archive.read(name)))
              for name in (
                  'filelist/DirectoryItemCountLoader', 'filelist/FileSelectionBar',
                  'ui/FabProgressRing', 'filejob/ArchiveJobProgressDialogFragment'
              ):
                  descriptor = 'Lme/zhanghai/android/files/' + name + ';'
                  if descriptor not in classes:
                      raise RuntimeError('Missing file-list implementation: ' + name)
              abis = {name.split('/')[1] for name in names
                      if name.startswith('lib/') and name.endswith('.so')}
              if 'arm64-v8a' not in abis:
                  raise RuntimeError('Missing ARM64 native libraries')
              for abi in sorted(abis):
                  for library in ('hiddenapi', 'syscall', 'archive_jbinding', '7-Zip-JBinding'):
                      if f'lib/{abi}/lib{library}.so' not in names:
                          raise RuntimeError(f'Missing {abi} native library: {library}')
          print('ZIP, file-list classes and native libraries verified')
          PY
          sha256sum "$apk" > "$apk.sha256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: materialfiles-debug-${{ github.sha }}
          path: ${{ runner.temp }}/materialfiles-debug/*
          if-no-files-found: error
          retention-days: 90

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: materialfiles-debug-reports-${{ github.sha }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 30
